version: 2
updates:
  # npm — weekly, grouped, patch + minor only.
  # Major bumps get reviewed manually because they typically break the
  # build (eslint 8→10 restructures flat-config, allure 2→3 changes the
  # reporter API, etc.). If you want a major, bump it in a PR of your own.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    groups:
      patch-and-minor:
        update-types:
          - patch
          - minor
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - automated

  # GitHub Actions — same rule. Action majors (checkout@4 → @6) sometimes
  # rename inputs or change default behaviour; review them before taking.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: Asia/Singapore
    open-pull-requests-limit: 3
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
    labels:
      - dependencies
      - ci
