name: Nightly regression

on:
  schedule:
    # 02:00 UTC — late evening in North American tz, early morning in IST/SG.
    # Hits the demo sites at their lowest-load window.
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  regression:
    name: Nightly full regression (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run BDD suite (${{ matrix.browser }})
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BATCH_ID: nightly-${{ github.run_id }}
          APPLITOOLS_BATCH_NAME: 'Nightly regression'
        run: npx bddgen && npx playwright test --project=bdd:${{ matrix.browser }}

      - name: Run API suite (chromium leg only)
        if: matrix.browser == 'chromium'
        run: npm run test:api

      - name: Write Allure environment metadata
        if: always()
        run: npx tsx scripts/allure-env.ts

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-allure-results-${{ matrix.browser }}
          path: allure-results/
          retention-days: 30

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-playwright-report-${{ matrix.browser }}
          path: playwright-report/
          retention-days: 30

  summary:
    name: Summarize regression
    needs: regression
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Summarize
        run: |
          echo "## Nightly regression summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Batch ID: nightly-${{ github.run_id }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Applitools dashboard: https://eyes.applitools.com/app/test-results/" >> "$GITHUB_STEP_SUMMARY"
          echo "- Allure results per browser attached as artifacts (30-day retention)." >> "$GITHUB_STEP_SUMMARY"
