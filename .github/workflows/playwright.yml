name: Playwright BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      # The public demo site (practicesoftwaretesting.com) sits behind
      # Cloudflare, which shows a bot-challenge interstitial to requests
      # from GitHub Actions runner IPs. That challenge page replaces the
      # real Angular SPA, so UI selectors never resolve and tests fail
      # with "Cart contained 0 items" (or similar). To avoid this, we
      # run the application locally in CI via its official docker-compose
      # stack and point the tests at http://localhost:4200.
      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: demo-app
          ref: main

      - name: Start demo app via docker compose
        working-directory: demo-app
        run: |
          # The repo's own .env sets SPRINT=sprint5 which the compose file
          # interpolates into volume paths. Nothing extra needed.
          docker compose up -d
          docker compose ps

      # The laravel-api image shares /var/www with a one-shot `composer`
      # service that installs PHP dependencies. `php artisan` will fail
      # until composer finishes, and the DB container also needs time to
      # initialise. Retry the seed until both prerequisites are ready.
      - name: Run database migrations and seed
        working-directory: demo-app
        timeout-minutes: 10
        run: |
          echo "Seeding database (this also proves composer install + MariaDB are ready)..."
          for i in $(seq 1 40); do
            echo "--- Attempt ${i} ---"
            if docker compose exec -T laravel-api php artisan migrate:fresh --seed --force; then
              echo "Seed completed on attempt ${i}"
              exit 0
            fi
            sleep 15
          done
          echo "Seed never succeeded"
          docker compose logs --tail=200 composer laravel-api mariadb
          exit 1

      # The angular-ui container runs `npm install --force && ng serve`
      # from scratch, which takes 3-5 minutes on first boot. Be patient.
      - name: Wait for frontend to serve
        timeout-minutes: 8
        run: |
          echo "Waiting for http://localhost:4200 to respond..."
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:4200 >/dev/null 2>&1; then
              echo "Frontend responded after ${i} attempts"
              exit 0
            fi
            sleep 5
          done
          echo "Frontend never came up"
          exit 1

      - name: Verify backend has seeded data
        run: |
          echo "Fetching /products from http://localhost:8091 ..."
          RESP=$(curl -fsS "http://localhost:8091/products?page=1" || echo "")
          echo "Response preview (first 500 chars): ${RESP:0:500}"
          if ! echo "$RESP" | grep -q '"id"'; then
            echo "ERROR: /products returned no items — seed did not populate products"
            exit 1
          fi
          echo "Seeded products confirmed"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run BDD tests
        env:
          BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091
        run: npm run test:bdd
        timeout-minutes: 20

      - name: Dump demo app logs on failure
        if: failure()
        working-directory: demo-app
        run: docker compose logs --tail=400

      - name: Teardown demo app
        if: always()
        working-directory: demo-app
        run: docker compose down -v

      - name: Generate Allure report
        if: always()
        run: npx allure-commandline generate allure-results --clean -o allure-report || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
