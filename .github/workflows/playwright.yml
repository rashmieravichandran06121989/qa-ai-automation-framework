name: Playwright BDD Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout tests
        uses: actions/checkout@v4

      # The public demo site (practicesoftwaretesting.com) sits behind
      # Cloudflare, which shows a bot-challenge interstitial to requests
      # from GitHub Actions runner IPs. That challenge page replaces the
      # real Angular SPA, so UI selectors never resolve and the cart tests
      # fail with "Cart contained 0 items". To avoid this entirely, we
      # run the application locally in CI via its official docker-compose
      # stack and point the tests at http://localhost:4200.
      - name: Checkout demo app
        uses: actions/checkout@v4
        with:
          repository: testsmith-io/practice-software-testing
          path: demo-app
          ref: main

      - name: Start demo app via docker compose
        working-directory: demo-app
        run: |
          docker compose -f docker-compose.yml up -d
          docker compose ps

      - name: Wait for demo app to be ready
        run: |
          echo "Waiting for backend on http://localhost:8091 ..."
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:8091/status >/dev/null 2>&1 \
               || curl -fsS http://localhost:8091/api/status >/dev/null 2>&1 \
               || curl -fsS http://localhost:8091 >/dev/null 2>&1; then
              echo "Backend responded after ${i} attempts"
              break
            fi
            sleep 5
          done

          echo "Waiting for frontend on http://localhost:4200 ..."
          for i in $(seq 1 90); do
            if curl -fsS http://localhost:4200 >/dev/null 2>&1; then
              echo "Frontend responded after ${i} attempts"
              break
            fi
            sleep 5
          done

          # Final sanity check — fail the job early if either is still down.
          curl -fsS -o /dev/null http://localhost:4200
          curl -fsS -o /dev/null http://localhost:8091 \
            || curl -fsS -o /dev/null http://localhost:8091/status \
            || curl -fsS -o /dev/null http://localhost:8091/api/status

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run BDD tests
        env:
          BASE_URL: http://localhost:4200
          API_BASE_URL: http://localhost:8091
        run: npm run test:bdd
        timeout-minutes: 15

      - name: Dump demo app logs on failure
        if: failure()
        working-directory: demo-app
        run: docker compose logs --tail=300

      - name: Teardown demo app
        if: always()
        working-directory: demo-app
        run: docker compose down -v

      - name: Generate Allure report
        if: always()
        run: npx allure-commandline generate allure-results --clean -o allure-report || true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Allure report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-report
          path: allure-report/
          retention-days: 14
