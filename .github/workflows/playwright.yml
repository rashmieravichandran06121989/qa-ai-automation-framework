name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  # ── Security gate ─────────────────────────────────────────────────────────
  # Fail fast on supply-chain or leaked-secret issues before burning a single
  # browser runner. npm audit + gitleaks + CodeQL, in that order of cost.
  security:
    name: Supply chain + secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts so we don't run a malicious postinstall while
      # we're still auditing the lockfile.
      - name: Install (no scripts)
        run: npm ci --ignore-scripts

      - name: npm audit (production deps, high+)
        run: npm audit --audit-level=high --omit=dev

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: CodeQL init
        uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript

      - name: CodeQL analyze
        uses: github/codeql-action/analyze@v3

  # ── Quality gate ──────────────────────────────────────────────────────────
  # Blocks the matrix if lint/typecheck/format fails. Cheap, fast, deterministic.
  quality:
    name: Lint + Typecheck + Format
    needs: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  # ── Test matrix ───────────────────────────────────────────────────────────
  # 3 browsers x 4 shards = 12 parallel runners. Each runner executes 1/4 of
  # the BDD suite on its assigned browser. Cuts wall-clock time roughly 4x
  # versus the single-runner-per-browser layout.
  test:
    name: Test ${{ matrix.browser }} · shard ${{ matrix.shard }}/4
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
        shard: [1, 2, 3, 4]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Cache Playwright browser binaries by Playwright version. Without
      # this, every runner re-downloads ~300MB per job. Key on the resolved
      # Playwright version so a library bump invalidates automatically.
      - name: Resolve Playwright version
        id: pw
        run: |
          v=$(node -p "require('@playwright/test/package.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}-${{ matrix.browser }}

      - name: Install Playwright browser (${{ matrix.browser }})
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run BDD shard
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BATCH_ID: ${{ github.run_id }}
        run: |
          npx bddgen
          npx playwright test \
            --project=bdd:${{ matrix.browser }} \
            --grep-invert @flaky \
            --shard=${{ matrix.shard }}/4

      - name: API suite (chromium shard 1 only)
        if: matrix.browser == 'chromium' && matrix.shard == 1
        run: npm run test:api

      - name: Write Allure env metadata
        if: always()
        run: npx tsx scripts/allure-env.ts

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-${{ matrix.browser }}-${{ matrix.shard }}
          path: allure-results/
          retention-days: 14

      # Traces, screenshots, videos on failure only. Keeps the green-run
      # artifact footprint small while preserving enough context to
      # debug a red run.
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-trace-${{ matrix.browser }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 30

  # ── Applitools gate ───────────────────────────────────────────────────────
  # Links the PR review comment to the visual diff dashboard. The batch
  # closes automatically when every test completes; this job exists so
  # reviewers have one click from the PR to the dashboard.
  applitools-gate:
    name: Applitools visual gate
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'pull_request' }}
    steps:
      - name: Surface dashboard link
        env:
          APPLITOOLS_API_KEY: ${{ secrets.APPLITOOLS_API_KEY }}
          APPLITOOLS_BATCH_ID: ${{ github.run_id }}
        run: |
          if [ -z "${APPLITOOLS_API_KEY}" ]; then
            echo "APPLITOOLS_API_KEY not set — skipping visual gate."
            exit 0
          fi
          echo "Applitools batch: https://eyes.applitools.com/app/test-results/"
          echo "Batch ID: ${APPLITOOLS_BATCH_ID}"

  # ── Allure publish ────────────────────────────────────────────────────────
  # Merges every shard's allure-results, generates one HTML report, and
  # publishes to gh-pages. Shard artifacts follow the allure-* naming
  # pattern so the merge step picks them up without enumeration.
  publish-allure:
    name: Publish Allure report
    needs: test
    runs-on: ubuntu-latest
    if: ${{ always() && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all shard allure results
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts
          pattern: allure-*

      - name: Merge shards
        run: |
          mkdir -p allure-results
          find ./artifacts -name 'allure-*' -type d -exec sh -c 'cp -r "$1"/* allure-results/ 2>/dev/null || true' _ {} \;

      - name: Install Allure CLI
        run: npm i -g allure-commandline

      - name: Generate Allure report
        run: allure generate allure-results --clean -o allure-report

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./allure-report
          keep_files: false
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # ── Notify on red ─────────────────────────────────────────────────────────
  # Fires only when main goes red. Self-skips if SLACK_WEBHOOK_URL isn't set.
  notify:
    name: Notify on red
    needs: [test, publish-allure]
    if: failure() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Slack ping
        if: ${{ env.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.27.1
        with:
          payload: |
            {
              "text": ":rotating_light: main is red — <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|run ${{ github.run_id }}>"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
