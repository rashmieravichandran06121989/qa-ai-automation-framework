services:
  tests:
    build: .
    image: qa-ai-automation-framework:local
    env_file:
      - .env
    environment:
      # Ensure BASE_URL etc. can still be overridden on the command line
      # without editing .env:
      #   docker compose run -e BASE_URL=https://staging.example.com tests
      BASE_URL: ${BASE_URL:-https://www.saucedemo.com}
      ORANGEHRM_BASE_URL: ${ORANGEHRM_BASE_URL:-https://opensource-demo.orangehrmlive.com}
      API_BASE_URL: ${API_BASE_URL:-https://jsonplaceholder.typicode.com}
    volumes:
      # Mount report outputs back to the host so a local Docker run still
      # produces a browsable Allure + Playwright report.
      - ./playwright-report:/app/playwright-report
      - ./allure-results:/app/allure-results
      - ./allure-report:/app/allure-report
      - ./test-results:/app/test-results
    shm_size: '2gb'
